name: Test and portable build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: npm run check
      - run: npm test
      - run: npm run package:portable
      - name: Archive portable folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath pentri-local-Windows.zip
      - name: Archive portable folder and preserve executable permissions
        if: runner.os != 'Windows'
        run: tar -czf pentri-local-${{ runner.os }}-${{ runner.arch }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: pentri-local-${{ matrix.os }}
          path: pentri-local-*
          retention-days: 14
